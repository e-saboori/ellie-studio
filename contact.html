<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Your Small Business Website | Ellie Studio</title>
  <meta name="description" content="Tell Ellie Studio about your business and website idea, and get help choosing the best way forward.">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div data-site-header></div>

  <main class="subpage contact-page">
    <section class="contact">
      <div class="page-shell contact__grid">
        <div class="contact__copy">
          <div class="contact__eyebrow">
            <img class="envelope" src="assets/doodles/letter.png" alt="" aria-hidden="true">
          </div>

          <h1>Don&rsquo;t know<br>where to start?<br><span>I&rsquo;m here to help.</span></h1>
          <p class="contact__intro">Tell me about your business and what you have in mind. I&rsquo;ll help you figure out the best way forward.</p>

          <div class="contact__reassurance">
            <img src="assets/icons/heart.svg" alt="" aria-hidden="true">
            <div>
              <strong>Not sure what you need yet?</strong>
              <p>A rough idea is enough.</p>
            </div>
          </div>
        </div>

        <form class="contact-form" action="https://formspree.io/f/xjgdowby" method="POST">
          <label>
            <span>Your Name</span>
            <input type="text" name="name" autocomplete="name" placeholder="Your name" required>
          </label>

          <label>
            <span>Email Address</span>
            <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
          </label>

          <label class="form-wide">
            <span>Name of Your Business</span>
            <input type="text" name="business-name" autocomplete="organization" placeholder="Your business name">
          </label>

          <label class="form-wide">
            <span>Type of Business</span>
            <select name="business-type" required>
              <option value="" selected disabled>e.g. Photographer, Boutique, Consultant</option>
              <option>Photographer</option>
              <option>Boutique</option>
              <option>Consultant</option>
              <option>Beauty / Wellness</option>
              <option>Creative Studio</option>
              <option>Other Small Business</option>
            </select>
          </label>

          <label class="form-wide">
            <span>Which package fits you better?</span>
            <select name="package" required>
              <option value="" selected disabled>Select your package</option>
              <option>Simple Start</option>
              <option>Small Business Website</option>
              <option>Launch Support</option>
              <option>I&rsquo;m not sure yet</option>
            </select>
          </label>

          <label class="form-wide">
            <span>Tell me more about your project</span>
            <textarea name="message" placeholder="Share your ideas, goals, and anything else I should know..." required></textarea>
          </label>

          <button class="btn btn--primary form-submit" type="submit">Submit</button>
        </form>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
  <script src="assets/js/site-components.js"></script>
  <script src="script.js"></script>
</body>
</html>
